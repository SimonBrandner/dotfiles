#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
prepend_keymap = [
  { on = "<Esc>", run = "close" },
  { on = "M", run = "plugin mount", desc = "Mount" },
  { on = "l", run = "plugin smart-enter", desc = "Smart enter" },
  { on = "<Enter>", run = "plugin smart-enter", desc = "Smart enter" },
  { on = "F", run = "plugin smart-filter", desc = "Smart filter" },
  { on = [
    "g",
    "r",
  ], run = "cd /", desc = "Go /" },
  { on = "!", for = "unix", run = 'shell "$SHELL" --block', desc = "Open $SHELL here" },
  { on = "<BackTab>", run = "plugin split-tabs spl_toggle", desc = "Split-tabs: toggle split tabs mode" },
  { on = "<Tab>", run = "plugin split-tabs spl_switch_tab", desc = "Split-tabs: switch to the other pane" },
  { on = "P", run = "plugin split-tabs spl_preview", desc = "Split-tabs: toggle preview pane" },
]
